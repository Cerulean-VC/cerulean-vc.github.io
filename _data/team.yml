  - name: Jahed Momand
    title: Co-founder and General Partner
    photo: jahed-momand.webp
    linkedin: https://www.linkedin.com/in/jahedmomand/
    bio:
      - Recovering biophysicist. Co-founded Magalix, where he applied machine learning to Kubernetes operations, open-sourced the product, grew it to 25,000 developers, and sold the company to Weaveworks. Building a complement company on an open ecosystem is the strategy Cerulean now underwrites across the physical economy.
      - He leads the firm's thesis work and writing — The End of Externalities, the open-source strategy essays, and the fund's investment notes — and he built Scout, the agentic operating system the firm runs on daily. Based in Barcelona; invests globally.

